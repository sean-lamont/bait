# @package _global_
defaults:
  - /base/logging_config@_here_
  - /base/exp_config@_here_

exp_config:
  name: test
  experiment: error_pred
  #  runs/${.experiment}/${.name}/${now:%Y_%m_%d}/${now:%H_%M}


logging_config:
  project: error_pred
  offline: true

model:
  _target_: models.end_to_end.tactic_models.error_pred.model.ErrorPredModel
  config:
    classifier_weight: 1
    load_ckpt: false
    tac_encoder: sean-lamont/leandojo-lean3-reprover-novel-premises
    goal_encoder: sean-lamont/leandojo-lean3-reprover-novel-premises
    decoder: sean-lamont/leandojo-lean3-reprover-novel-premises
    max_length: 2000
    num_samples: 4
    lr: 5e-5
    warmup_steps: 200

data_module:
  _target_: models.end_to_end.tactic_models.error_pred.datamodule.ErrorPredDataModule
  model_name: sean-lamont/leandojo-lean3-reprover-novel-premises
  batch_size: 2 # effective_batch_size == batch_size * accumulate_grad_batches * devices
  eval_batch_size: 2
  max_seq_len: 2000
  num_workers: 0
  trace_files: 'runs/bestfs-novel-2'
  replace: 'keep' # add/keep/drop files wrt the existing collection


trainer:
  accelerator: gpu
  devices: 2
  #  num_nodes: 2
  precision: bf16-mixed
  strategy:
    _target_: lightning.pytorch.strategies.DeepSpeedStrategy
    stage: 2
    offload_optimizer: false
    cpu_checkpointing: false
    logging_batch_size_per_gpu: 2

  gradient_clip_val: 1.0

  val_check_interval: 10 #10_000
  limit_val_batches: 10 #100


  callbacks:
    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: step
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      verbose: true
      save_top_k: 3
      save_last: true
      monitor: top4_acc_val
      mode: max
      dirpath: ${exp_config.directory}/checkpoints
      auto_insert_metric_name: true
      filename: "{epoch}-{step}-{top4_acc_val:.2f}"
      enable_version_counter: false

