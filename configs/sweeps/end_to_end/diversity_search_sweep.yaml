program: experiments.end_to_end.end_to_end_experiment
name: diversity_search
description: Diversity Search Sweep
project: minif2f

method: bayes
metric:
  goal: maximize
  name: Pass@1
parameters:
  search_model.diversity_config.p:
    values: [ 0.90, 0.95, 0.99 ]
  search_model.diversity_config.temperature:
    values: [ 1, 2 ]
  exp_config.name:
    values: ['diversity_search-p${search_model.diversity_config.p}-t${search_model.diversity_config.temperature}']

command:
  - ${env}
  - ${interpreter}
  - '-m'
  - ${program}
  - '--config-name=end_to_end/diversity_search'
  - ${args_no_hyphens}
