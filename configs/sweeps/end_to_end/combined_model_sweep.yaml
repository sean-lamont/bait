program: experiments.end_to_end.end_to_end_experiment
name: combined_model_sweep
description: Combined Model Sweep
project: minif2f

method: grid
metric:
  goal: maximize
  name: Pass@1
parameters:
  tac_model.diversity_config.p:
    values: [ 0.75, 0.9, 0.95 ]
  tac_model.diversity_config.error_weight:
    values: [ 0.1, 0.5, 1 ]
  #  tac_model.diversity_config.temperature:
  #    values: [ 1, 2 ]
  exp_config.name:
    values: [ 'combined_model-p${tac_model.diversity_config.p}-e${tac_model.diversity_config.error_weight}' ]

command:
  - ${env}
  - ${interpreter}
  - '-m'
  - ${program}
  - '--config-name=end_to_end/diversity_tac_model'
  - ${args_no_hyphens}

