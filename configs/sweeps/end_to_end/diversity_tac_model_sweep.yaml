program: experiments.end_to_end.end_to_end_experiment
name: diversity_tac_model
description: Diversity Tac Model Sweep
project: minif2f

method: bayes
metric:
  goal: maximize
  name: Pass@1
parameters:
  tac_model.diversity_config.p:
    values: [ 0.9, 0.95 ]
  tac_model.diversity_config.temperature:
    values: [ 1, 2 ]
  exp_config.name:
    values: [ 'diversity_tac_model-p${tac_model.diversity_config.p}-t${tac_model.diversity_config.temperature}' ]

command:
  - ${env}
  - ${interpreter}
  - '-m'
  - ${program}
  - '--config-name=end_to_end/diversity_tac_model'
  - ${args_no_hyphens}

