program: experiments.end_to_end.end_to_end_experiment
name: bestfs_top_p
description: BestFS Top-p Sweep
project: minif2f

method: bayes
metric:
  goal: maximize
  name: Pass@1
parameters:
  search_model.diversity_config.p:
    values: [ 75, 0.9, 0.95 ]
  exp_config.name:
    values: [ 'bestfs_top_p-p${search_model.diversity_config.p}' ]

command:
  - ${env}
  - ${interpreter}
  - '-m'
  - ${program}
  - '--config-name=end_to_end/bestfs_top_p'
  - ${args_no_hyphens}